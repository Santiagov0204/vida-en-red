# Nombre de la aplicación
spring.application.name=backend

# Conexión a la base de datos de Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/vidaenred_db
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: crea o actualiza las tablas automáticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
