version: '3.8'

services:
  # Servicio 1: Base de datos PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: vidaenred_db
    restart: always
    environment:
      POSTGRES_DB: vidaenred_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: # Guarda los datos en tu disco para que no se borren al apagar Docker
